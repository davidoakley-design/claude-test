<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Engineering Team Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.95);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --border: rgba(148, 163, 184, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(244, 114, 182, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(52, 211, 153, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 1rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #f472b6, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.3rem;
            font-weight: 300;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 0.75rem;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stat strong {
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* Canvas wrapper */
        #diagram-wrapper {
            position: relative;
            background: var(--bg-secondary);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03),
                0 25px 80px -15px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        #diagram-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 1.5rem;
            background: radial-gradient(ellipse at center, rgba(99,102,241,0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: default;
        }

        /* Detail panel */
        #detail-panel {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%) translateX(30px);
            width: 340px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 2rem;
            box-shadow: 0 30px 80px -12px rgba(0,0,0,0.6);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(24px);
        }

        #detail-panel.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) translateX(0);
        }

        #close-panel {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        #close-panel:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        #panel-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .panel-header-text {
            min-width: 0;
        }

        #panel-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        #panel-size {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.3rem;
            font-size: 0.78rem;
            color: #a5b4fc;
            font-weight: 500;
        }

        .panel-divider {
            height: 1px;
            background: var(--border);
            margin: 1rem 0;
        }

        #panel-description {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.65;
            margin-bottom: 1.25rem;
        }

        .skills-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        #panel-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .skill-tag {
            padding: 0.22rem 0.6rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 400;
            transition: all 0.2s ease;
        }

        .skill-tag:hover {
            background: rgba(99,102,241,0.15);
            border-color: rgba(99,102,241,0.3);
            color: #c7d2fe;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container { padding: 1rem; }
            header h1 { font-size: 1.5rem; }
            .stats-bar { gap: 1rem; }

            #detail-panel {
                right: 0.75rem;
                left: 0.75rem;
                width: auto;
                top: auto;
                bottom: 0.75rem;
                transform: translateY(30px);
                max-height: 50vh;
                overflow-y: auto;
            }

            #detail-panel.visible {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Data Engineering Team Network</h1>
            <p class="subtitle">Interactive Organization Map &mdash; Click any node for details, hover to explore</p>
            <div class="stats-bar">
                <div class="stat"><strong>141</strong> professionals</div>
                <div class="stat"><strong>13</strong> teams</div>
                <div class="stat"><strong>1</strong> mission</div>
            </div>
        </header>
        <div id="diagram-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <div id="detail-panel">
            <button id="close-panel" aria-label="Close">&times;</button>
            <div class="panel-header">
                <div id="panel-icon"></div>
                <div class="panel-header-text">
                    <div id="panel-title"></div>
                    <div id="panel-size"></div>
                </div>
            </div>
            <div class="panel-divider"></div>
            <p id="panel-description"></p>
            <div class="skills-label">Tech Stack</div>
            <div id="panel-skills"></div>
        </div>
    </div>

    <script>
    // ============================================
    // Data Engineering Network — Canvas Interactive
    // ============================================

    const teamData = [
        {
            id: 'core', name: 'Core Data\nEngineering', count: 22,
            baseRadius: 72, color: '#6366f1', colorLight: '#818cf8',
            icon: '\u2699\uFE0F',
            description: 'The central hub orchestrating all data pipelines, infrastructure, and platform services across the organization.',
            skills: ['Spark', 'Airflow', 'Kafka', 'dbt', 'Snowflake', 'Python']
        },
        {
            id: 'ml', name: 'ML\nEngineering', count: 18,
            baseRadius: 56, color: '#db2777', colorLight: '#f472b6',
            icon: '\uD83E\uDDE0',
            description: 'Building and deploying machine learning models at scale, MLOps pipelines, and feature stores.',
            skills: ['PyTorch', 'MLflow', 'Kubeflow', 'TensorFlow', 'Ray']
        },
        {
            id: 'product', name: 'Product\nAnalytics', count: 15,
            baseRadius: 50, color: '#059669', colorLight: '#34d399',
            icon: '\uD83D\uDCCA',
            description: 'Driving product decisions through A/B testing, funnel analysis, and user behavior insights.',
            skills: ['Amplitude', 'Mixpanel', 'SQL', 'Python', 'Looker']
        },
        {
            id: 'datasci', name: 'Data\nScience', count: 14,
            baseRadius: 48, color: '#2563eb', colorLight: '#60a5fa',
            icon: '\uD83D\uDD2C',
            description: 'Advanced statistical modeling, forecasting, and research to unlock deep business insights.',
            skills: ['R', 'Python', 'Jupyter', 'Pandas', 'SciPy']
        },
        {
            id: 'marketing', name: 'Marketing\nData', count: 12,
            baseRadius: 44, color: '#ea580c', colorLight: '#fb923c',
            icon: '\uD83D\uDCE3',
            description: 'Attribution modeling, campaign analytics, and marketing performance optimization.',
            skills: ['Google Analytics', 'Segment', 'SQL', 'Tableau']
        },
        {
            id: 'platform', name: 'Platform\nEngineering', count: 11,
            baseRadius: 42, color: '#7c3aed', colorLight: '#a78bfa',
            icon: '\u2601\uFE0F',
            description: 'Cloud infrastructure, data platform tooling, and developer experience for data teams.',
            skills: ['AWS', 'Terraform', 'K8s', 'Docker', 'Pulumi']
        },
        {
            id: 'customer', name: 'Customer\nSuccess', count: 10,
            baseRadius: 40, color: '#0d9488', colorLight: '#2dd4bf',
            icon: '\uD83D\uDE0A',
            description: 'Customer health scoring, churn prediction, and success metrics tracking.',
            skills: ['SQL', 'Python', 'Salesforce', 'Gainsight']
        },
        {
            id: 'devops', name: 'DevOps\nData', count: 9,
            baseRadius: 38, color: '#d97706', colorLight: '#fbbf24',
            icon: '\uD83D\uDD27',
            description: 'CI/CD for data pipelines, monitoring, observability, and data reliability engineering.',
            skills: ['GitHub Actions', 'Datadog', 'PagerDuty', 'Prometheus']
        },
        {
            id: 'sales', name: 'Sales\nAnalytics', count: 8,
            baseRadius: 36, color: '#dc2626', colorLight: '#f87171',
            icon: '\uD83D\uDCB0',
            description: 'Revenue analytics, sales forecasting, pipeline optimization, and CRM data management.',
            skills: ['Salesforce', 'SQL', 'Tableau', 'Python']
        },
        {
            id: 'supply', name: 'Supply\nChain', count: 7,
            baseRadius: 34, color: '#16a34a', colorLight: '#4ade80',
            icon: '\uD83D\uDE9A',
            description: 'Supply chain optimization, demand forecasting, and logistics data analytics.',
            skills: ['SAP', 'Python', 'SQL', 'Tableau']
        },
        {
            id: 'finance', name: 'Finance\nData', count: 6,
            baseRadius: 32, color: '#9333ea', colorLight: '#c084fc',
            icon: '\uD83C\uDFE6',
            description: 'Financial reporting automation, budget analytics, and revenue recognition data pipelines.',
            skills: ['SQL', 'Python', 'NetSuite', 'Looker']
        },
        {
            id: 'risk', name: 'Risk &\nCompliance', count: 5,
            baseRadius: 30, color: '#475569', colorLight: '#94a3b8',
            icon: '\uD83D\uDEE1\uFE0F',
            description: 'Data governance, regulatory compliance, privacy engineering, and risk assessment.',
            skills: ['Collibra', 'OneTrust', 'SQL', 'Python']
        },
        {
            id: 'hr', name: 'HR\nAnalytics', count: 4,
            baseRadius: 28, color: '#ec4899', colorLight: '#f9a8d4',
            icon: '\uD83D\uDC65',
            description: 'People analytics, workforce planning, and employee experience measurement.',
            skills: ['Workday', 'SQL', 'Python', 'Tableau']
        }
    ];

    // ---- Setup ----
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const detailPanel = document.getElementById('detail-panel');
    const dpr = window.devicePixelRatio || 1;

    let W, H, cx, cy;
    let nodes = [];
    let hoveredNode = null;
    let selectedNode = null;
    let mouseX = -1000, mouseY = -1000;
    let animTime = 0;
    let particles = [];

    function resize() {
        const wrapper = document.getElementById('diagram-wrapper');
        const rect = wrapper.getBoundingClientRect();
        W = rect.width;
        H = Math.min(W * 0.62, window.innerHeight * 0.72);
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = W / 2;
        cy = H / 2;
        layoutNodes();
    }

    function layoutNodes() {
        const scale = Math.min(W / 1000, H / 700);
        const angles = [0, 250, 50, 200, 20, 160, 110, 290, 340, 80, 230, 315, 140];
        const dists =  [0, 240, 250, 260, 280, 270, 290, 250, 300, 310, 300, 240, 300];

        teamData.forEach((team, i) => {
            const angle = angles[i] * Math.PI / 180;
            const dist = dists[i] * scale;
            const r = team.baseRadius * scale;
            const x = cx + Math.cos(angle) * dist;
            const y = cy + Math.sin(angle) * dist;

            if (nodes[i]) {
                nodes[i].targetX = x;
                nodes[i].targetY = y;
                nodes[i].radius = r;
            } else {
                nodes[i] = {
                    ...team, x, y, targetX: x, targetY: y,
                    radius: r, hoverScale: 1, glowAlpha: 0
                };
            }
        });
    }

    // ---- Particles flowing along connections ----
    function spawnParticle(node) {
        const core = nodes[0];
        const t = Math.random();
        particles.push({
            fromX: core.x, fromY: core.y,
            toX: node.x, toY: node.y,
            t, speed: 0.003 + Math.random() * 0.004,
            alpha: 0.4 + Math.random() * 0.4,
            size: 1 + Math.random() * 1.5,
            color: node.colorLight
        });
    }

    // ---- Drawing ----
    function drawConnection(from, to, highlight) {
        const alpha = highlight ? 0.5 : 0.12;
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);

        // Slight curve for visual interest
        const mx = (from.x + to.x) / 2;
        const my = (from.y + to.y) / 2;
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const cx1 = mx + dy * 0.05;
        const cy1 = my - dx * 0.05;
        ctx.quadraticCurveTo(cx1, cy1, to.x, to.y);

        if (highlight) {
            ctx.strokeStyle = to.colorLight || to.color;
            ctx.lineWidth = 2.5;
            ctx.globalAlpha = 0.4;
            ctx.stroke();
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = alpha;
        } else {
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1;
            ctx.globalAlpha = alpha;
            ctx.setLineDash([4, 6]);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
    }

    function drawNode(node, i) {
        const s = node.hoverScale;
        const r = node.radius * s;

        ctx.save();

        // Outer glow when hovered/selected
        if (node.glowAlpha > 0.01) {
            const grd = ctx.createRadialGradient(node.x, node.y, r * 0.8, node.x, node.y, r * 1.8);
            grd.addColorStop(0, hexAlpha(node.colorLight, node.glowAlpha * 0.3));
            grd.addColorStop(1, hexAlpha(node.colorLight, 0));
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(node.x, node.y, r * 1.8, 0, Math.PI * 2);
            ctx.fill();
        }

        // Shadow
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 6;

        // Main gradient circle
        const grad = ctx.createRadialGradient(
            node.x - r * 0.2, node.y - r * 0.3, 0,
            node.x, node.y, r
        );
        grad.addColorStop(0, node.colorLight);
        grad.addColorStop(1, node.color);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = 'transparent';

        // Subtle highlight arc on top
        ctx.beginPath();
        ctx.arc(node.x, node.y - r * 0.1, r * 0.85, Math.PI * 1.2, Math.PI * 1.8);
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = r * 0.06;
        ctx.stroke();

        // Hover ring
        if (node.glowAlpha > 0.01) {
            ctx.beginPath();
            ctx.arc(node.x, node.y, r + 3, 0, Math.PI * 2);
            ctx.strokeStyle = hexAlpha('#ffffff', node.glowAlpha * 0.35);
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Text
        const fontSize = r > 40 ? 13 * s : r > 28 ? 10.5 * s : 9 * s;
        ctx.fillStyle = '#ffffff';
        ctx.font = `600 ${fontSize}px Inter, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const lines = node.name.split('\n');
        const lineH = fontSize * 1.25;
        const textTop = node.y - ((lines.length - 1) * lineH) / 2 - (r > 35 ? 6 : 3) * s;
        lines.forEach((line, li) => {
            ctx.fillText(line, node.x, textTop + li * lineH);
        });

        // Count
        const countSize = r > 40 ? 11 * s : 9 * s;
        ctx.font = `300 ${countSize}px Inter, sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillText(node.count + ' members', node.x, textTop + lines.length * lineH + 2 * s);

        ctx.restore();
    }

    function drawPulseRings(time) {
        const core = nodes[0];
        if (!core) return;

        for (let i = 0; i < 3; i++) {
            const phase = ((time / 2500) + i / 3) % 1;
            const r = core.radius + phase * core.radius * 0.5;
            const alpha = (1 - phase) * 0.3;
            ctx.beginPath();
            ctx.arc(core.x, core.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = hexAlpha('#6366f1', alpha);
            ctx.lineWidth = 2 - phase;
            ctx.stroke();
        }
    }

    function drawParticles() {
        particles.forEach(p => {
            const x = p.fromX + (p.toX - p.fromX) * p.t;
            const y = p.fromY + (p.toY - p.fromY) * p.t;
            ctx.beginPath();
            ctx.arc(x, y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = hexAlpha(p.color, p.alpha * (1 - Math.abs(p.t - 0.5) * 2));
            ctx.fill();
        });
    }

    // ---- Animation loop ----
    function animate(time) {
        animTime = time;
        ctx.clearRect(0, 0, W, H);

        // Update particles
        if (Math.random() < 0.15) {
            const ri = 1 + Math.floor(Math.random() * (nodes.length - 1));
            if (nodes[ri]) spawnParticle(nodes[ri]);
        }
        particles.forEach(p => { p.t += p.speed; });
        particles = particles.filter(p => p.t < 1);

        // Update node hover animations
        nodes.forEach((node, i) => {
            const isHovered = hoveredNode === node;
            const isSelected = selectedNode === node;
            const targetScale = isHovered ? 1.12 : isSelected ? 1.06 : 1;
            const targetGlow = (isHovered || isSelected) ? 1 : 0;
            node.hoverScale += (targetScale - node.hoverScale) * 0.12;
            node.glowAlpha += (targetGlow - node.glowAlpha) * 0.1;
        });

        // Draw connections
        const core = nodes[0];
        for (let i = 1; i < nodes.length; i++) {
            const highlight = hoveredNode === nodes[i] || selectedNode === nodes[i] ||
                              hoveredNode === core || selectedNode === core;
            drawConnection(core, nodes[i], highlight);
        }

        // Particles
        drawParticles();

        // Pulse rings
        drawPulseRings(time);

        // Draw satellite nodes first, then core on top
        for (let i = nodes.length - 1; i >= 1; i--) drawNode(nodes[i], i);
        if (nodes[0]) drawNode(nodes[0], 0);

        requestAnimationFrame(animate);
    }

    // ---- Interaction ----
    function getNodeAt(x, y) {
        // Check in reverse so topmost (core) is checked first
        for (let i = 0; i < nodes.length; i++) {
            const n = nodes[i];
            const dx = x - n.x, dy = y - n.y;
            if (dx * dx + dy * dy <= n.radius * n.radius * 1.2) return n;
        }
        return null;
    }

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
        const node = getNodeAt(mouseX, mouseY);
        hoveredNode = node;
        canvas.style.cursor = node ? 'pointer' : 'default';
    });

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const node = getNodeAt(x, y);

        if (node) {
            selectedNode = node;
            showDetail(node);
        } else {
            selectedNode = null;
            hideDetail();
        }
    });

    canvas.addEventListener('mouseleave', () => {
        hoveredNode = null;
        mouseX = -1000;
        mouseY = -1000;
    });

    function showDetail(node) {
        document.getElementById('panel-title').textContent = node.name.replace('\n', ' ');
        document.getElementById('panel-size').innerHTML = '\uD83D\uDC65 ' + node.count + ' team members';
        document.getElementById('panel-description').textContent = node.description;
        document.getElementById('panel-icon').style.background =
            `linear-gradient(135deg, ${node.color}33, ${node.color}88)`;
        document.getElementById('panel-icon').textContent = node.icon;

        const skillsContainer = document.getElementById('panel-skills');
        skillsContainer.innerHTML = '';
        node.skills.forEach(skill => {
            const tag = document.createElement('span');
            tag.classList.add('skill-tag');
            tag.textContent = skill;
            skillsContainer.appendChild(tag);
        });

        detailPanel.classList.add('visible');
    }

    function hideDetail() {
        detailPanel.classList.remove('visible');
    }

    document.getElementById('close-panel').addEventListener('click', (e) => {
        e.stopPropagation();
        selectedNode = null;
        hideDetail();
    });

    // ---- Utility ----
    function hexAlpha(hex, alpha) {
        if (hex.startsWith('rgba')) return hex;
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    }

    // ---- Init ----
    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(animate);
    </script>
</body>
</html>
