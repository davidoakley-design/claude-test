<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Engineering Team Network</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Data Engineering Team Network</h1>
            <p class="subtitle">Interactive Organization Map &mdash; Click any node for details</p>
        </header>
        <div id="diagram-wrapper">
            <svg id="network-svg" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradient definitions for nodes -->
                    <radialGradient id="grad-core" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#6366f1"/>
                        <stop offset="100%" stop-color="#4338ca"/>
                    </radialGradient>
                    <radialGradient id="grad-ml" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#f472b6"/>
                        <stop offset="100%" stop-color="#db2777"/>
                    </radialGradient>
                    <radialGradient id="grad-product" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#34d399"/>
                        <stop offset="100%" stop-color="#059669"/>
                    </radialGradient>
                    <radialGradient id="grad-datasci" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#60a5fa"/>
                        <stop offset="100%" stop-color="#2563eb"/>
                    </radialGradient>
                    <radialGradient id="grad-marketing" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#fb923c"/>
                        <stop offset="100%" stop-color="#ea580c"/>
                    </radialGradient>
                    <radialGradient id="grad-platform" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#a78bfa"/>
                        <stop offset="100%" stop-color="#7c3aed"/>
                    </radialGradient>
                    <radialGradient id="grad-customer" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#2dd4bf"/>
                        <stop offset="100%" stop-color="#0d9488"/>
                    </radialGradient>
                    <radialGradient id="grad-devops" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#fbbf24"/>
                        <stop offset="100%" stop-color="#d97706"/>
                    </radialGradient>
                    <radialGradient id="grad-sales" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#f87171"/>
                        <stop offset="100%" stop-color="#dc2626"/>
                    </radialGradient>
                    <radialGradient id="grad-supply" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#4ade80"/>
                        <stop offset="100%" stop-color="#16a34a"/>
                    </radialGradient>
                    <radialGradient id="grad-finance" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#c084fc"/>
                        <stop offset="100%" stop-color="#9333ea"/>
                    </radialGradient>
                    <radialGradient id="grad-risk" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#94a3b8"/>
                        <stop offset="100%" stop-color="#475569"/>
                    </radialGradient>
                    <radialGradient id="grad-hr" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#f9a8d4"/>
                        <stop offset="100%" stop-color="#ec4899"/>
                    </radialGradient>

                    <!-- Glow filter -->
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>

                    <!-- Shadow filter -->
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
                    </filter>

                    <!-- Pulse animation -->
                    <filter id="pulse-glow">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Connection lines (drawn first, behind nodes) -->
                <g id="connections" opacity="0.4"></g>

                <!-- Nodes group -->
                <g id="nodes"></g>
            </svg>
        </div>

        <!-- Tooltip / Detail panel -->
        <div id="detail-panel" class="hidden">
            <button id="close-panel" aria-label="Close">&times;</button>
            <div id="panel-icon"></div>
            <h2 id="panel-title"></h2>
            <div id="panel-size"></div>
            <p id="panel-description"></p>
            <div id="panel-skills"></div>
        </div>
    </div>

    <script src="diagram.js"></script>
</body>
</html>
